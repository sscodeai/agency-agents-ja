name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate agent files
        run: scripts/validate.sh

      - name: Check agent count
        run: |
          TOTAL=$(find engineering project-management testing product marketing paid-media finance hr design legal sales support supply-chain specialized -name '*.md' -type f | wc -l)
          echo "Total agents: $TOTAL"
          test "$TOTAL" -ge 87
