name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate agent files
        run: scripts/validate.sh

      - name: Generate integrations
        run: bash scripts/convert.sh --parallel --jobs 4

      - name: Validate generated integrations
        run: npm run check:generated-integrations

      - name: Check agent count
        run: |
          TOTAL=$(find academic engineering project-management testing product marketing paid-media finance game-development gis healthcare hr design legal sales security spatial-computing support supply-chain specialized -name '*.md' -type f | wc -l | tr -d ' ')
          LIST_TOTAL=$(sed -n 's/^Total agents: \([0-9][0-9]*\).*/\1/p' AGENT-LIST.md)
          echo "Total agents: $TOTAL"
          echo "AGENT-LIST total: $LIST_TOTAL"
          test "$TOTAL" -eq "$LIST_TOTAL"
