name: Lint Agent Files

on:
  pull_request:
    paths:
      - "academic/**"
      - "company/**"
      - "design/**"
      - "engineering/**"
      - "finance/**"
      - "game-development/**"
      - "gis/**"
      - "healthcare/**"
      - "hr/**"
      - "legal/**"
      - "marketing/**"
      - "paid-media/**"
      - "sales/**"
      - "security/**"
      - "product/**"
      - "project-management/**"
      - "research/**"
      - "testing/**"
      - "support/**"
      - "spatial-computing/**"
      - "specialized/**"
      - "supply-chain/**"
      # Changing lint or conversion rules has to run the linter too; otherwise a
      # new rule can land without ever checking the full roster.
      - "scripts/lint-agents.sh"
      - "scripts/convert.sh"
      - "scripts/lib.sh"

jobs:
  lint:
    name: Validate agent frontmatter and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed agent files
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- \
            'academic/**/*.md' 'company/**/*.md' 'design/**/*.md' 'engineering/**/*.md' 'finance/**/*.md' 'game-development/**/*.md' 'gis/**/*.md' 'healthcare/**/*.md' 'hr/**/*.md' 'legal/**/*.md' 'marketing/**/*.md' 'paid-media/**/*.md' 'sales/**/*.md' 'product/**/*.md' \
            'project-management/**/*.md' 'research/**/*.md' 'testing/**/*.md' 'support/**/*.md' \
            'security/**/*.md' 'spatial-computing/**/*.md' 'specialized/**/*.md' 'supply-chain/**/*.md')
          {
            echo "files<<ENDOFLIST"
            echo "$FILES"
            echo "ENDOFLIST"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "No agent files changed."
          else
            echo "Changed files:"
            echo "$FILES"
          fi

      - name: Run agent linter
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          chmod +x scripts/lint-agents.sh
          ./scripts/lint-agents.sh $CHANGED_FILES

  lint-all:
    name: Whole roster, when the linter changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the linter or the color map change?
        id: rules
        run: |
          RULES="scripts/lint-agents.sh scripts/convert.sh scripts/lib.sh"
          CHANGED=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" -- $RULES)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Linting the whole roster because these changed:"
            echo "$CHANGED"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Linter unchanged - the changed-files job is the right scope here."
          fi

      - name: Lint every agent in the roster
        if: steps.rules.outputs.changed == 'true'
        run: |
          chmod +x scripts/lint-agents.sh
          ./scripts/lint-agents.sh
